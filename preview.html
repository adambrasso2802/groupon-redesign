<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Groupon HomeScreen — Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #dbeafe 0%, #d1fae5 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 48px;
      gap: 20px;
    }

    .page-label {
      font-size: 13px;
      font-weight: 600;
      color: #6b7280;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* ─── Phone frame ─── */
    .phone-frame {
      width: 390px;
      max-width: 100%;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #f9fafb;
      border-radius: 52px;
      overflow: hidden;
      box-shadow:
        0 0 0 2px #4b5563,
        0 0 0 10px #1a1a1a,
        0 32px 80px rgba(0,0,0,0.45);
    }

    /* ─── Status bar ─── */
    .status-bar {
      background: #fff;
      padding: 14px 24px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
      color: #111827;
    }

    .status-icons { display: flex; align-items: center; gap: 6px; }

    /* ─── Header ─── */
    .home-header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      flex-shrink: 0;
    }

    .groupon-logo {
      font-weight: 800;
      font-size: 22px;
      color: #16a34a;
      letter-spacing: -0.5px;
    }

    .search-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: #111827;
      line-height: 0;
    }

    /* ─── Scrollable feed ─── */
    .feed {
      flex: 1;
      overflow-y: auto;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .feed::-webkit-scrollbar { display: none; }

    /* ─── Deal card ─── */
    .deal-card {
      background: #fff;
      margin-bottom: 8px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .deal-card:last-child { margin-bottom: 0; }
    .deal-card:active { opacity: 0.95; }

    .deal-hero {
      width: 100%;
      height: 195px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: rgba(255,255,255,0.95);
      user-select: none;
    }

    .hero-emoji { font-size: 52px; line-height: 1; }

    .hero-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    }

    .deal-body { padding: 12px 14px 14px; }

    .deal-category {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #9ca3af;
      margin-bottom: 4px;
    }

    .deal-title {
      font-size: 15px;
      font-weight: 700;
      color: #111827;
      line-height: 1.3;
      margin-bottom: 3px;
    }

    .deal-merchant {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 6px;
    }

    .deal-rating {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 8px;
    }

    .stars { color: #f59e0b; font-size: 12px; letter-spacing: 1px; }

    .rating-text { font-size: 12px; color: #6b7280; }

    .deal-pricing {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .price-deal {
      font-size: 19px;
      font-weight: 800;
      color: #111827;
    }

    .price-original {
      font-size: 14px;
      text-decoration: line-through;
      color: #9ca3af;
    }

    .price-discount {
      font-size: 13px;
      font-weight: 700;
      color: #16a34a;
      background: #dcfce7;
      padding: 1px 6px;
      border-radius: 4px;
    }

    .deal-reason {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 10px;
      display: flex;
      align-items: flex-start;
      gap: 4px;
      line-height: 1.4;
    }

    /* ─── Refund badge ─── */
    .refund-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
    }

    .refund-badge.green  { background: #22c55e; }
    .refund-badge.amber  { background: #f59e0b; }
    .refund-badge.red    { background: #ef4444; }

    /* ─── Bottom tab bar ─── */
    .bottom-tab-bar {
      flex-shrink: 0;
      background: #fff;
      border-top: 1px solid #e5e7eb;
      display: flex;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 4px 12px;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      font-weight: 400;
      font-family: inherit;
      color: #6b7280;
      line-height: 1;
    }

    .tab-btn.active {
      color: #16a34a;
      font-weight: 700;
    }

    /* ─── Badge legend (outside phone) ─── */
    .badge-legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #374151;
      font-weight: 500;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <p class="page-label">Groupon HomeScreen · Mobile Preview · 390 × 844</p>

  <div class="phone-frame">

    <!-- Status bar -->
    <div class="status-bar">
      <span>12:41</span>
      <div class="status-icons">
        <!-- Signal bars -->
        <svg width="17" height="12" viewBox="0 0 17 12" fill="#111827" aria-hidden="true">
          <rect x="0"  y="7" width="3" height="5" rx="0.5"/>
          <rect x="4.5" y="5" width="3" height="7" rx="0.5"/>
          <rect x="9"  y="2.5" width="3" height="9.5" rx="0.5"/>
          <rect x="13.5" y="0" width="3" height="12" rx="0.5"/>
        </svg>
        <!-- WiFi -->
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#111827" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <path d="M8 9.5a1 1 0 1 0 0 2 1 1 0 0 0 0-2z" fill="#111827" stroke="none"/>
          <path d="M5 7.5 C6 6.2 7 5.5 8 5.5 C9 5.5 10 6.2 11 7.5"/>
          <path d="M2.5 5C4.2 3 6 2 8 2s3.8 1 5.5 3"/>
        </svg>
        <!-- Battery -->
        <svg width="24" height="12" viewBox="0 0 24 12" fill="none" aria-hidden="true">
          <rect x="0.75" y="0.75" width="19.5" height="10.5" rx="2.5" stroke="#111827" stroke-width="1.5"/>
          <path d="M21 4v4a2 2 0 0 1 0-4z" fill="#111827"/>
          <rect x="2.5" y="2.5" width="15" height="7" rx="1.5" fill="#111827"/>
        </svg>
      </div>
    </div>

    <!-- App header -->
    <header class="home-header">
      <div class="groupon-logo" aria-label="Groupon">Groupon</div>
      <button class="search-btn" aria-label="Open search">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <!-- Deal feed — rendered by JS -->
    <main class="feed" id="feed" aria-label="Personalized deals"></main>

    <!-- Bottom tab bar -->
    <nav class="bottom-tab-bar" aria-label="Main navigation">
      <button class="tab-btn active" aria-label="Home" aria-current="page">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 12L12 3l9 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9 21V12h6v9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5 10v11h14V10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Home</span>
      </button>
      <button class="tab-btn" aria-label="Search">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>Search</span>
      </button>
      <button class="tab-btn" aria-label="My Groupons">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
          <path d="M3 9h18" stroke="currentColor" stroke-width="2"/>
          <path d="M9 13h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>My Groupons</span>
      </button>
      <button class="tab-btn" aria-label="Support">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
          <path d="M12 8v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="16" r="1" fill="currentColor"/>
        </svg>
        <span>Support</span>
      </button>
    </nav>

  </div><!-- /.phone-frame -->

  <!-- Badge state legend -->
  <div class="badge-legend" aria-label="Refund badge legend">
    <div class="legend-item">
      <div class="legend-dot" style="background:#22c55e;"></div>
      <span><strong>Green</strong> — refundable ≥ 24 h window</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#f59e0b;"></div>
      <span><strong>Amber</strong> — refundable &lt; 24 h window</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#ef4444;"></div>
      <span><strong>Red</strong> — no refund</span>
    </div>
  </div>

  <script>
    // ─── Fixture data (from src/fixtures/recommendations.ts) ───
    // Cards 4 & 5 have adjusted refundPolicy to demonstrate amber and red badge states.
    const DEALS = [
      {
        dealId: "mock-001",
        title: "90-Minute Deep Tissue Massage",
        merchant: { name: "Serenity Day Spa", rating: 4.8, reviewCount: 412 },
        category: "spa_wellness",
        hero: { gradient: "linear-gradient(135deg,#f9c8df,#c0508a)", emoji: "🧖", label: "Spa & Wellness" },
        pricing: { dealPriceCents: 4999, originalPriceCents: 12000 },
        refundPolicy: {
          isRefundable: true, windowAmount: 24, windowUnit: "hours",
          plainTextSummary: "Free cancellation up to 24h before appt",
        },
        recommendation: { reason: "Because you booked spa days before" },
      },
      {
        dealId: "mock-002",
        title: "3-Course Dinner for Two",
        merchant: { name: "The Oak Room", rating: 4.6, reviewCount: 289 },
        category: "food_drink",
        hero: { gradient: "linear-gradient(135deg,#ffd4a3,#d06820)", emoji: "🍽️", label: "Food & Drink" },
        pricing: { dealPriceCents: 4499, originalPriceCents: 9000 },
        refundPolicy: {
          isRefundable: true, windowAmount: 48, windowUnit: "hours",
          plainTextSummary: "Free cancellation up to 48h before reservation",
        },
        recommendation: { reason: "Top-rated date night near you" },
      },
      {
        dealId: "mock-003",
        title: "1-Month Unlimited Gym Access",
        merchant: { name: "IronHouse Gym", rating: 4.5, reviewCount: 631 },
        category: "fitness",
        hero: { gradient: "linear-gradient(135deg,#93c5fd,#1d4ed8)", emoji: "💪", label: "Fitness" },
        pricing: { dealPriceCents: 2999, originalPriceCents: 7900 },
        refundPolicy: {
          isRefundable: true, windowAmount: 7, windowUnit: "days",
          plainTextSummary: "Free cancellation within 7 days of purchase",
        },
        recommendation: { reason: "Popular with fitness fans in your area" },
      },
      {
        // amber badge — refundable but < 24 h window (adjusted for demo)
        dealId: "mock-004",
        title: "Kids' Indoor Adventure Park — Family Pass",
        merchant: { name: "Bounce Zone", rating: 4.7, reviewCount: 198 },
        category: "family_kids",
        hero: { gradient: "linear-gradient(135deg,#c084fc,#7e22ce)", emoji: "🎪", label: "Family & Kids" },
        pricing: { dealPriceCents: 3499, originalPriceCents: 7000 },
        refundPolicy: {
          isRefundable: true, windowAmount: 4, windowUnit: "hours",
          plainTextSummary: "Cancellation up to 4h before your visit",
        },
        recommendation: { reason: "Trending with families nearby" },
      },
      {
        // red badge — not refundable (adjusted for demo)
        dealId: "mock-005",
        title: "Full Dog Grooming Session",
        merchant: { name: "Pampered Paws Salon", rating: 4.9, reviewCount: 87 },
        category: "pets",
        hero: { gradient: "linear-gradient(135deg,#6ee7b7,#059669)", emoji: "🐾", label: "Pets" },
        pricing: { dealPriceCents: 2499, originalPriceCents: 5500 },
        refundPolicy: {
          isRefundable: false, windowAmount: 0, windowUnit: "hours",
          plainTextSummary: "No refunds or cancellations",
        },
        recommendation: { reason: "Highest-rated pet groomer in your city" },
      },
      {
        dealId: "mock-006",
        title: "Sunset Kayak Tour for Two",
        merchant: { name: "Blue Horizon Adventures", rating: 4.8, reviewCount: 143 },
        category: "activities",
        hero: { gradient: "linear-gradient(135deg,#7dd3fc,#0369a1)", emoji: "🚣", label: "Activities" },
        pricing: { dealPriceCents: 7999, originalPriceCents: 16000 },
        refundPolicy: {
          isRefundable: true, windowAmount: 48, windowUnit: "hours",
          plainTextSummary: "Free cancellation up to 48h before tour",
        },
        recommendation: { reason: "Adventure awaits — a weekend favourite near you" },
      },
    ];

    // ─── Logic (mirrors src/components/RefundPolicyBadge.tsx) ───
    function getRefundBadgeColor(rp) {
      if (!rp.isRefundable) return "red";
      const hours = rp.windowUnit === "hours" ? rp.windowAmount : rp.windowAmount * 24;
      if (hours >= 24) return "green";
      if (hours > 0)   return "amber";
      return "red";
    }

    function formatDollars(cents) {
      return "$" + (cents / 100).toFixed(2);
    }

    function renderStars(rating) {
      const full = Math.floor(rating);
      return "★".repeat(full) + (rating - full >= 0.5 ? "½" : "");
    }

    function esc(s) {
      return String(s)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");
    }

    // ─── Render (mirrors DealCard.tsx) ───
    function renderCard(deal, position) {
      const discountPct = Math.round(
        ((deal.pricing.originalPriceCents - deal.pricing.dealPriceCents) /
          deal.pricing.originalPriceCents) * 100
      );
      const badgeColor = getRefundBadgeColor(deal.refundPolicy);
      const catLabel   = deal.category.replace(/_/g, " ");

      const badgeIcon = badgeColor === "green" ? "✓" : badgeColor === "amber" ? "⚠" : "✕";

      return `
        <div
          class="deal-card"
          role="button"
          tabindex="0"
          aria-label="${esc(deal.title)}"
          data-testid="deal-card"
          data-position="${position}"
        >
          <div
            class="deal-hero"
            style="background:${deal.hero.gradient};"
            aria-hidden="true"
          >
            <span class="hero-emoji" role="img" aria-hidden="true">${deal.hero.emoji}</span>
            <span class="hero-label">${esc(deal.hero.label)}</span>
          </div>

          <div class="deal-body">
            <div class="deal-category" data-testid="deal-card-category">${esc(catLabel)}</div>
            <div class="deal-title"   data-testid="deal-card-title">${esc(deal.title)}</div>
            <div class="deal-merchant" data-testid="deal-card-merchant">${esc(deal.merchant.name)}</div>

            <div class="deal-rating">
              <span class="stars" aria-hidden="true">${renderStars(deal.merchant.rating)}</span>
              <span class="rating-text">${deal.merchant.rating} (${deal.merchant.reviewCount.toLocaleString()})</span>
            </div>

            <div class="deal-pricing">
              <span class="price-deal"     data-testid="deal-card-price">${esc(formatDollars(deal.pricing.dealPriceCents))}</span>
              <span class="price-original" data-testid="deal-card-original-price">${esc(formatDollars(deal.pricing.originalPriceCents))}</span>
              ${discountPct > 0
                ? `<span class="price-discount" data-testid="deal-card-discount">${discountPct}% off</span>`
                : ""}
            </div>

            ${deal.recommendation
              ? `<div class="deal-reason" data-testid="deal-card-reason">
                   <span aria-hidden="true">✨</span>
                   <span>${esc(deal.recommendation.reason)}</span>
                 </div>`
              : ""}

            <span
              class="refund-badge ${badgeColor}"
              data-testid="refund-policy-badge"
              data-color="${badgeColor}"
            >${badgeIcon} ${esc(deal.refundPolicy.plainTextSummary)}</span>
          </div>
        </div>`;
    }

    // ─── Mount ───
    const feed = document.getElementById("feed");
    feed.innerHTML = DEALS.map((d, i) => renderCard(d, i)).join("");

    // Keyboard navigation for cards
    feed.addEventListener("keydown", (e) => {
      if (e.target.classList.contains("deal-card") &&
          (e.key === "Enter" || e.key === " ")) {
        e.preventDefault();
        e.target.click();
      }
    });
  </script>

</body>
</html>
